<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caralta · Interactive Prototype</title>
<meta name="description" content="Caralta, a car expense tracker designed at Clarice Technologies, rebuilt as a clickable prototype. Portfolio project by Abhishek Bora.">
<script>if(/[?&]embed/.test(location.search))document.documentElement.classList.add('embed')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gas:#4264fb; --svc:#33c376; --rep:#ff5353; --ink:#1e1e28; --ink2:#2d2d32; --mute:#787887; --faint:#b4b4be; --line:#eaeaea; --bg:#fff; --soft:#f6f6f6; --link:#337db3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#ececec;height:100%}
body{font-family:"Nunito Sans","Avenir Next",Avenir,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink2);-webkit-font-smoothing:antialiased;font-size:15px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img,svg{display:block}
.app{position:relative;max-width:430px;margin:0 auto;height:100vh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
html.embed body{background:#fff}
html.embed .app{max-width:none}

/* top bar */
.bar{flex:none;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:5}
.bar h1{font-size:20px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.bar h1 small{font-size:11px;color:var(--faint);font-weight:700}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;position:relative}
.ib:active{background:var(--soft)}
.badge{position:absolute;top:6px;right:6px;min-width:17px;height:17px;border-radius:9px;background:var(--gas);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}

/* pager */
.pager{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:none;width:100%;height:100%;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
.dots{flex:none;display:flex;justify-content:center;gap:0;padding:6px 0 10px;background:#fff}
.dots button{padding:6px 5px}
.dots i{display:block;width:6px;height:6px;border-radius:50%;background:#d6d6dc;transition:all .2s}
.dots button.on i{background:var(--ink2);width:16px;border-radius:3px}

/* overview */
.hero{text-align:center;padding:22px 16px 8px}
.carimg{width:120px;height:90px;margin:0 auto;border-radius:6px;object-fit:cover;box-shadow:0 6px 16px -8px rgba(0,0,0,.4);background:var(--soft)}
.carph{width:120px;height:90px;margin:0 auto;border-radius:6px;background:linear-gradient(180deg,#f3f5f8,#e4e8ee);display:grid;place-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px}
.stats small{display:block;font-size:12px;color:var(--mute)}
.stats b{display:block;font-size:15px;font-weight:600;color:var(--ink2);margin-top:4px}
.stats button{border-radius:8px;padding:4px 0}
.stats button:active{background:var(--soft)}
.mon{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-top:1px solid var(--line);margin-top:16px}
.mon h2{font-size:16px;font-weight:600;color:#000}
.mon button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.mon button:disabled{opacity:.25}
.seg{display:flex;height:4px;background:var(--line)}
.seg i{display:block;height:100%;transition:width .4s ease}
.cats{padding:8px 0 4px}
.cat{width:100%;display:flex;align-items:center;gap:14px;padding:11px 20px;text-align:left}
.cat:active{background:var(--soft)}
.cat .n{flex:1;font-size:15px;color:#000}
.cat .v{font-size:15px;color:#000}
.cat .pc{font-size:12px;color:var(--faint);width:40px;text-align:right}
.tot{display:flex;justify-content:space-between;padding:12px 20px 18px 62px;font-size:15px;color:#000}
.tot b{font-weight:800}
.tip{margin:6px 16px 20px;padding:12px 14px;border-radius:10px;background:#f2fbff;font-size:13px;line-height:19px;color:#2f5f82;display:flex;gap:10px;align-items:flex-start}

/* icons in circles */
.ci{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.ci.fill.gas{background:var(--gas)} .ci.fill.service{background:var(--svc)} .ci.fill.repair{background:var(--rep)}
.ci.line{border:1.5px solid currentColor;background:#fff}
.ci.line.gas{color:var(--gas)} .ci.line.service{color:var(--svc)} .ci.line.repair{color:var(--rep)}

/* expenses */
.th{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 14px 60px;font-size:15px;color:#000}
.th b{font-size:16px;font-weight:800}
.filters{display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fc{flex:none;height:30px;padding:0 13px;border-radius:15px;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px}
.fc i{width:8px;height:8px;border-radius:50%}
.fc.on{border-color:var(--ink2);color:var(--ink2)}
.ex{width:100%;display:flex;align-items:center;gap:14px;padding:13px 20px;border-bottom:1px solid var(--line);text-align:left;background:#fff;animation:rowin .3s ease}
@keyframes rowin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ex:active{background:var(--soft)}
.ex .t{flex:1;min-width:0}
.ex b{display:block;font-size:15px;font-weight:600;color:#000}
.ex small{display:block;font-size:12px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex .v{font-size:15px;color:#000}
.ex.new{background:#f4fff8}
.empty{text-align:center;color:var(--mute);font-size:14px;padding:30px 20px}
.addwrap{position:sticky;bottom:0;display:flex;justify-content:center;padding:18px 0 16px;background:linear-gradient(180deg,rgba(255,255,255,0),#fff 40%)}
.pill{height:46px;padding:0 24px;border-radius:24px;border:1.5px solid #000;background:#fff;font-size:15px;font-weight:800;color:#000;display:inline-flex;align-items:center;gap:8px}
.pill:active{transform:scale(.97)}
.pill.dark{background:var(--ink2);color:#fff;border-color:var(--ink2)}

/* picker (fab expansion) */
.pick{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:88px;background:rgba(255,255,255,.8);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.pick.on{opacity:1;pointer-events:auto}
.pick .row{display:flex;gap:14px}
.big{width:74px;height:74px;border-radius:50%;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;box-shadow:0 10px 22px -8px rgba(0,0,0,.35);transform:translateY(30px) scale(.5);opacity:0;transition:transform .35s cubic-bezier(.2,.9,.3,1.3),opacity .2s}
.big.gas{background:var(--gas)} .big.service{background:var(--svc)} .big.repair{background:var(--rep)}
.pick.on .big{transform:none;opacity:1}
.pick.on .big:nth-child(2){transition-delay:.04s}
.pick.on .big:nth-child(3){transition-delay:.08s}
.xbtn{margin-top:22px;width:46px;height:46px;border-radius:50%;border:1.5px solid #000;background:#fff;display:grid;place-items:center}
.pick h3{font-size:14px;color:var(--mute);font-weight:700;margin-bottom:16px}

/* add form (full screen) */
.form{position:fixed;inset:0;z-index:55;max-width:430px;margin:0 auto;background:#fff;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
html.embed .form{max-width:none}
.form.on{transform:none}
.ftop{display:flex;align-items:center;justify-content:space-between;padding:22px 34px 10px}
.circ{width:48px;height:48px;border-radius:50%;display:grid;place-items:center}
.circ.o{border:1.5px solid #000}
.circ.d{background:var(--ink2)}
.circ.d:disabled{opacity:.3}
.circ.big2{width:78px;height:78px;color:#fff;flex-direction:column;display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700}
.circ.big2.gas{background:var(--gas)} .circ.big2.service{background:var(--svc)} .circ.big2.repair{background:var(--rep)}
.fields{padding:18px 38px 0}
.f{margin-top:18px;border-bottom:1.5px solid var(--line)}
.f:focus-within{border-color:var(--ink2)}
.f label{display:block;font-size:11px;color:#343c4d}
.f input,.f select{width:100%;border:0;outline:0;background:transparent;font-size:17px;color:#343c4d;padding:6px 0 8px}
.f input::placeholder{color:#b9bcc4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sugs button{height:30px;padding:0 12px;border-radius:15px;background:var(--soft);font-size:13px;color:var(--ink2)}
.photo{margin-top:22px;display:flex;align-items:center;gap:10px;color:var(--link);font-size:14px;font-weight:700}
.photo .ph{width:52px;height:52px;border-radius:8px;border:1.5px dashed #c9ccd4;display:grid;place-items:center}
.photo .ph.ok{border:0;background:linear-gradient(135deg,#e9edf4,#dfe5ee)}
.fnote{font-size:12px;color:var(--faint);padding:20px 38px 0}

/* map */
.map{position:absolute;inset:0;overflow:hidden;background:#eef0f2}
.map svg.base{position:absolute;left:50%;top:50%;width:760px;height:900px;transform:translate(-50%,-50%)}
.mchips{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;z-index:3}
.mchip{height:32px;padding:0 12px;border-radius:16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:13px;font-weight:700;color:var(--mute);display:flex;align-items:center;gap:6px}
.mchip i{width:9px;height:9px;border-radius:50%}
.mchip.on{color:var(--ink2)}
.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);transition:transform .2s}
.pin .ci{width:34px;height:34px;box-shadow:0 3px 8px rgba(0,0,0,.2)}
.pin.sel{transform:translate(-50%,-50%) scale(1.25);z-index:3}
.pin.hide{display:none}
.me{position:absolute;z-index:2;transform:translate(-50%,-50%)}
.me span{display:block;width:30px;height:30px;border-radius:50%;background:#000;border:3px solid #fff;box-shadow:0 0 0 8px rgba(66,100,251,.15);display:grid;place-items:center}
.pcard{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:14px 18px 16px;display:flex;align-items:center;gap:10px;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.pcard.on{transform:none}
.pcard .t{flex:1;min-width:0}
.pcard b{display:block;font-size:14px;font-weight:800;color:#343c4d}
.pcard small{display:block;font-size:13px;color:#343c4d;line-height:18px}
.pcard .mini{width:60px;height:34px;border-radius:17px;border:1.5px solid #000;display:grid;place-items:center;background:#fff}
.route{position:absolute;inset:0;z-index:1;pointer-events:none}

/* sheets, drawer, toast */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(20,20,28,.4);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-width:430px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-height:85vh;overflow:auto}
html.embed .sheet{max-width:none}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:#ddd;margin:0 auto 14px}
.sheet h3{font-size:18px;font-weight:800;color:#000}
.rem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.rem:last-child{border:0}
.rem b{display:block;font-size:14px;color:#000}
.rem span{font-size:13px;color:var(--mute);line-height:18px}
.rem .when{margin-left:auto;font-size:12px;font-weight:800;white-space:nowrap}
.det{display:flex;align-items:center;gap:14px;margin-top:6px}
.det .ci{width:48px;height:48px}
.det b{font-size:20px;color:#000;font-weight:800}
.kv{margin-top:14px}
.kv div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span{color:var(--mute)}
.acts2{display:flex;gap:10px;margin-top:18px}
.acts2 button{flex:1;height:44px;border-radius:22px;font-weight:800;font-size:14px}
.acts2 .del{color:var(--rep);border:1.5px solid var(--rep)}
.acts2 .ok{background:var(--ink2);color:#fff}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:61;width:min(282px,80vw);background:#f7f7f7;transform:translateX(-102%);transition:transform .28s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .prof{padding:30px 24px 22px}
.drawer .prof img{width:54px;height:54px;border-radius:50%;object-fit:cover}
.drawer .prof b{display:block;font-size:17px;font-weight:600;color:var(--ink2);margin-top:12px}
.drawer .prof span{font-size:13px;color:var(--ink2)}
.drawer nav button{width:100%;display:flex;align-items:center;gap:16px;height:52px;padding:0 24px;font-size:14px;color:var(--ink2);text-align:left}
.drawer nav button.on{background:var(--ink2);color:#fafafa}
.drawer nav button.on svg{color:#fafafa}
.drawer nav svg{color:#999}
.drawer hr{border:0;border-top:1px solid #e6e6e6;margin:10px 0}
.drawer .fine{margin-top:auto;padding:0 24px 20px;font-size:11px;line-height:16px;color:var(--faint)}
.toast{position:fixed;left:50%;bottom:84px;z-index:95;transform:translate(-50%,16px);opacity:0;background:#1e1e28;color:#fff;font-size:13px;line-height:18px;padding:10px 16px;border-radius:20px;max-width:86%;text-align:center;transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--gas);outline-offset:2px;border-radius:8px}
.desk-note{display:none}
@media (min-width:600px){
  html:not(.embed) body{padding:28px 0}
  html:not(.embed) .app{border-radius:24px;height:calc(100vh - 56px);max-height:880px;box-shadow:0 20px 60px -20px rgba(0,0,0,.3)}
  html:not(.embed) .desk-note{display:block;text-align:center;font-size:12px;color:#8a8a94;margin-top:14px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <button class="ib" data-menu aria-label="Open menu"><svg width="18" height="14" viewBox="0 0 18 14" fill="none" stroke="#2d2d32" stroke-width="1.5" stroke-linecap="round"><path d="M1 1h16M1 7h16M1 13h16"/></svg></button>
    <h1 id="carName">Accord</h1>
    <button class="ib" data-bell aria-label="Reminders"><svg width="18" height="20" viewBox="0 0 18 20" fill="#2d2d32"><path d="M9 20a2.3 2.3 0 0 0 2.3-2.3H6.7A2.3 2.3 0 0 0 9 20Zm7-6V9a7 7 0 0 0-5.3-6.8V1.7a1.7 1.7 0 0 0-3.4 0v.5A7 7 0 0 0 2 9v5l-2 2v1h18v-1l-2-2Z"/></svg><span class="badge" id="bellN">3</span></button>
  </header>
  <main class="pager" id="pager" aria-label="Screens">
    <section class="page" id="p0" aria-label="Overview"></section>
    <section class="page" id="p1" aria-label="Expenses"></section>
    <section class="page" id="p2" aria-label="Nearby"></section>
  </main>
  <nav class="dots" id="dots" aria-label="Pages">
    <button class="on" data-page="0" aria-label="Overview"><i></i></button><button data-page="1" aria-label="Expenses"><i></i></button><button data-page="2" aria-label="Nearby"><i></i></button>
  </nav>
</div>
<p class="desk-note">Caralta · car expense app designed at Clarice Technologies, rebuilt as a clickable prototype. Swipe between the three screens.</p>

<div class="pick" id="pick" role="dialog" aria-label="Choose a category">
  <h3>What did you spend on?</h3>
  <div class="row">
    <button class="big gas" data-new="gas"></button>
    <button class="big service" data-new="service"></button>
    <button class="big repair" data-new="repair"></button>
  </div>
  <button class="xbtn" data-closepick aria-label="Close"><svg width="16" height="16" viewBox="0 0 16 16" stroke="#000" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l12 12M14 2 2 14"/></svg></button>
</div>
<form class="form" id="form" autocomplete="off" aria-label="Add expense"></form>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Menu"></aside>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------------- data ---------------- */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CAT = {
  gas:{label:'Gas', color:'#4264fb', sugs:['Petrol','Diesel','Full tank']},
  service:{label:'Service', color:'#33c376', sugs:['Car wash','General service','Oil change','Wheel alignment']},
  repair:{label:'Repair', color:'#ff5353', sugs:['Tyre fix','Battery','Brake pads','Dent repair']}
};
const CATS = Object.keys(CAT);
const CARS = {
  accord:{name:'Accord', model:'Honda Accord 2016', img:'img/accord.webp', km:16523, value:650000},
  camry:{name:'Camry', model:'Toyota Camry 2014', img:null, km:48210, value:420000}
};
let uid=0;
const E = (car,cat,title,place,m,d,amt)=>({id:++uid,car,cat,title,place,m,d,amt});
const EXP = [
  // Accord
  E('accord','gas','Gas','BP Brooklyn',10,4,1800), E('accord','gas','Gas','Shell, Koramangala',10,12,2200), E('accord','gas','Gas','BP Brooklyn',10,22,2400),
  E('accord','service','Car wash','Sparkle Car Spa',10,18,450), E('accord','service','General service','Honda Service, HSR',10,9,6800),
  E('accord','repair','Tyre fix','Raju Tyres',10,26,350), E('accord','repair','Wiper blades','Car Mall',10,15,900),
  E('accord','gas','Gas','Reliance, Ejipura',9,6,2100), E('accord','gas','Gas','BP Brooklyn',9,20,2300), E('accord','service','Car wash','Sparkle Car Spa',9,14,450), E('accord','repair','Battery','Amaron Point',9,27,5400),
  E('accord','gas','Gas','Shell, Koramangala',8,3,1900), E('accord','gas','Gas','BP Brooklyn',8,17,2250), E('accord','service','Wheel alignment','Tyre Plus',8,11,800),
  E('accord','gas','Gas','Reliance, Ejipura',11,2,2000), E('accord','service','Car wash','Sparkle Car Spa',11,5,450),
  // Camry
  E('camry','gas','Gas','Indian Oil, Indiranagar',10,7,2600), E('camry','gas','Gas','HP, Domlur',10,21,2500), E('camry','repair','Brake pads','Toyota Service, Whitefield',10,13,4200), E('camry','service','Oil change','Quick Lube',10,28,1600),
  E('camry','gas','Gas','HP, Domlur',9,10,2700), E('camry','service','Car wash','Shine Wash',9,24,400)
];
const PLACES = [
  {cat:'gas', name:'Reliance', info:'Petrol ₹101.9/L · open 24 hrs', km:1.2, x:.46, y:.24, phone:'+91 80 4115 2231'},
  {cat:'gas', name:'Shell, Koramangala', info:'Petrol ₹102.4/L · car wash on site', km:2.4, x:.78, y:.62, phone:'+91 80 4101 7788'},
  {cat:'repair', name:'Raju Tyres', info:'Puncture repair · from ₹150', km:0.9, x:.25, y:.45, phone:'+91 98450 32211'},
  {cat:'repair', name:'Car Mall Repairs', info:'Dents, paint, batteries · 4.5★', km:3.1, x:.18, y:.78, phone:'+91 80 4222 9010'},
  {cat:'service', name:'Sparkle Car Spa', info:'Car wash from ₹450 · 4.6★', km:1.8, x:.72, y:.36, phone:'+91 99720 11445'},
  {cat:'service', name:'Honda Service, HSR', info:'Authorised service centre', km:4.6, x:.56, y:.86, phone:'+91 80 4333 6000'}
];
const ME = {x:.52, y:.52};
const TODAY = {m:11, d:8};   // prototype "today": 8 Dec
const S = { car:'accord', m:10, filter:'all', page:0, place:null, mapFilter:'all', seen:false, draft:null, lastNew:null };

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const short=n=> n>=100000 ? '₹'+(n/100000).toFixed(n%100000?1:0)+' Lac' : n>=1000 ? '₹'+(n/1000).toFixed(2).replace(/\.?0+$/,'')+'K' : inr(n);
const car=()=>CARS[S.car];
const monthExp=(m=S.m)=>EXP.filter(e=>e.car===S.car&&e.m===m);
const sumBy=(list,cat)=>list.filter(e=>!cat||e.cat===cat).reduce((a,e)=>a+e.amt,0);
const maxMonth=()=>TODAY.m;
const minMonth=()=>Math.min(...EXP.filter(e=>e.car===S.car).map(e=>e.m));

/* ---------------- icons ---------------- */
const IC = {
  gas:(c='#fff')=>`<svg width="15" height="16" viewBox="0 0 15 16" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"><path d="M2 15V2.5A1.5 1.5 0 0 1 3.5 1h5A1.5 1.5 0 0 1 10 2.5V15M1 15h10M3.5 3.5h5v3.5h-5z"/><path d="M10 6h1.3A1.2 1.2 0 0 1 12.5 7.2v4.3a1 1 0 0 0 2 0V5L12.8 3.2" stroke-linecap="round"/></svg>`,
  service:(c='#fff')=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6.5h9v2.5H3zM5 9v2.5h5V9M7.5 11.5V15"/><path d="M5 1.5l.5 1.5M8 1v1.6M11 1.5l-.5 1.5M4 4.3l.8.8M11 4.3l-.8.8"/></svg>`,
  repair:(c='#fff')=>`<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 1.5a3 3 0 0 0-2.8 4L1.8 11.4a1.4 1.4 0 0 0 2 2l5.8-5.9a3 3 0 0 0 4-2.8l-1.8 1.8-1.7-.4-.4-1.7 1.8-1.8Z"/><path d="m2.5 2.5 4 4M1.5 4.5l3-3M10 10l4 4"/></svg>`,
  left:'<svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="#b4b4be" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1 1 9l8 8"/></svg>',
  right:'<svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="#b4b4be" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m1 1 8 8-8 8"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 16 16" stroke="#000" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l12 12M14 2 2 14"/></svg>',
  check:'<svg width="20" height="15" viewBox="0 0 20 15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 7.5 5.5 5.5L18.5 1.5"/></svg>',
  phone:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#000"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1Z"/></svg>',
  nav:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8-8-2Z"/></svg>',
  car:(c='currentColor')=>`<svg width="22" height="18" viewBox="0 0 24 20" fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round"><path d="M3 11l2-6a2 2 0 0 1 1.9-1.4h10.2A2 2 0 0 1 19 5l2 6M2 11h20v5H2zM4 16v2.5M20 16v2.5"/><circle cx="6.5" cy="13.5" r="1" fill="${c}"/><circle cx="17.5" cy="13.5" r="1" fill="${c}"/></svg>`,
  gear:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>',
  chat:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/></svg>',
  help:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg>',
  power:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v8M6.3 6.3a8 8 0 1 0 11.4 0"/></svg>',
  plus:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg width="22" height="20" viewBox="0 0 24 22" fill="none" stroke="#9aa0ab" stroke-width="1.6" stroke-linejoin="round"><path d="M2 6h5l2-3h6l2 3h5v13H2z"/><circle cx="12" cy="12" r="4"/></svg>'
};
const ci=(cat,style='fill',size)=>`<span class="ci ${style} ${cat}"${size?` style="width:${size}px;height:${size}px"`:''}>${IC[cat](style==='fill'?'#fff':CAT[cat].color)}</span>`;

/* ---------------- overview ---------------- */
function segBar(list){
  const tot=sumBy(list)||1;
  return `<div class="seg" aria-hidden="true">${CATS.map(c=>`<i style="width:${sumBy(list,c)/tot*100}%;background:${CAT[c].color}"></i>`).join('')}</div>`;
}
function overview(){
  const c=car(), list=monthExp(), all=EXP.filter(e=>e.car===S.car), tot=sumBy(list);
  const top = CATS.slice().sort((a,b)=>sumBy(list,b)-sumBy(list,a))[0];
  $('#p0').innerHTML = `
    <div class="hero">
      ${c.img?`<img class="carimg" src="${c.img}" alt="${esc(c.model)}">`:`<div class="carph">${IC.car('#9aa0ab')}</div>`}
      <div class="stats">
        <div><small>Distance driven</small><b>${c.km.toLocaleString('en-IN')} Kms</b></div>
        <button data-page="1"><small>Total spending</small><b>${short(sumBy(all))}</b></button>
        <div><small>Valued at</small><b>${short(c.value)}</b></div>
      </div>
    </div>
    <div class="mon"><button data-mon="-1" aria-label="Previous month" ${S.m<=minMonth()?'disabled':''}>${IC.left}</button><h2>${MONTHS[S.m]}</h2><button data-mon="1" aria-label="Next month" ${S.m>=maxMonth()?'disabled':''}>${IC.right}</button></div>
    ${segBar(list)}
    <div class="cats">${CATS.map(k=>`<button class="cat" data-cat="${k}">${ci(k)}<span class="n">${CAT[k].label==='Repair'?'Repairs':CAT[k].label}</span><span class="pc">${tot?Math.round(sumBy(list,k)/tot*100)+'%':''}</span><span class="v">${inr(sumBy(list,k))}</span></button>`).join('')}</div>
    <div class="tot"><span>Total Expenses</span><b>${inr(tot)}</b></div>
    ${tot?`<div class="tip"><span>💡</span><span>${CAT[top].label} was your biggest cost in ${MONTHS[S.m]}. Tap a category to see every expense.</span></div>`:''}`;
}

/* ---------------- expenses ---------------- */
function expenses(){
  const list=monthExp(), shown=list.filter(e=>S.filter==='all'||e.cat===S.filter).sort((a,b)=>b.d-a.d||b.id-a.id);
  $('#p1').innerHTML = `
    <div class="mon" style="margin-top:0;border-top:0"><button data-mon="-1" aria-label="Previous month" ${S.m<=minMonth()?'disabled':''}>${IC.left}</button><h2>${MONTHS[S.m]}</h2><button data-mon="1" aria-label="Next month" ${S.m>=maxMonth()?'disabled':''}>${IC.right}</button></div>
    <div class="th" style="border-top:1px solid var(--line)"><span>Total Expenses</span><b>${inr(sumBy(shown))}</b></div>
    ${segBar(list)}
    <div class="filters">${['all',...CATS].map(f=>`<button class="fc ${S.filter===f?'on':''}" data-filter="${f}">${f==='all'?'All':`<i style="background:${CAT[f].color}"></i>${CAT[f].label}`}</button>`).join('')}</div>
    ${shown.length?shown.map(e=>`<button class="ex ${S.lastNew===e.id?'new':''}" data-exp="${e.id}">${ci(e.cat,'line')}<span class="t"><b>${esc(e.title)}</b><small>${e.place?esc(e.place)+' • ':''}${e.d} ${MONTHS[e.m].slice(0,3)}</small></span><span class="v">${inr(e.amt)}</span></button>`).join('')
      :`<div class="empty">No ${S.filter==='all'?'':CAT[S.filter].label.toLowerCase()+' '}expenses in ${MONTHS[S.m]}.</div>`}
    <div class="addwrap"><button class="pill" data-add>Add Expense</button></div>`;
}

/* ---------------- map ---------------- */
function mapSvg(){
  // a quiet, hand-drawn city map (no real map tiles)
  let roads='', blocks='';
  const rnd=(i)=>((Math.sin(i*99.13)+1)/2);
  for(let i=0;i<60;i++){ const x=40+(i%10)*72+rnd(i)*20, y=40+Math.floor(i/10)*140+rnd(i+7)*30; blocks+=`<rect x="${x}" y="${y}" width="${40+rnd(i+3)*20}" height="${60+rnd(i+5)*50}" rx="3" fill="#e2e5e9"/>`; }
  roads += '<path d="M-20 300 C 200 260 420 380 780 330" stroke="#fff" stroke-width="18" fill="none"/>';
  roads += '<path d="M260 -20 C 300 250 220 520 330 920" stroke="#fff" stroke-width="16" fill="none"/>';
  roads += '<path d="M-20 640 L 780 560" stroke="#fff" stroke-width="12" fill="none"/>';
  roads += '<path d="M540 -20 L 470 920" stroke="#fff" stroke-width="12" fill="none"/>';
  roads += '<path d="M60 -20 C 120 300 40 600 120 920" stroke="#fff" stroke-width="8" fill="none"/>';
  roads += '<path d="M-20 120 L 780 170 M-20 470 L 780 450 M-20 800 L 780 760 M680 -20 L 700 920 M400 -20 L 380 920" stroke="#fff" stroke-width="6" fill="none"/>';
  const lab=(x,y,t,s=13)=>`<text x="${x}" y="${y}" font-size="${s}" letter-spacing="2" fill="#a3a8b2" font-family="Nunito Sans,sans-serif" font-weight="700">${t}</text>`;
  return `<svg class="base" viewBox="0 0 760 900" aria-hidden="true"><rect width="760" height="900" fill="#eef0f2"/>${blocks}<path d="M600 60 q60 40 40 120 t60 160" stroke="#cfe3f3" stroke-width="10" fill="none"/>${roads}
    ${lab(150,230,'NEELASANDRA')}${lab(430,250,'EJIPURA')}${lab(110,420,'ADUGODI')}${lab(330,520,'KORAMANGALA',15)}${lab(520,720,'ST BED LAYOUT',11)}${lab(120,720,'SADGUNTE PALYA',11)}</svg>`;
}
function mapPage(){
  $('#p2').innerHTML = `<div class="map" id="map">${mapSvg()}
    <svg class="route" id="route" preserveAspectRatio="none"></svg>
    <div class="mchips">${['all',...CATS].map(f=>`<button class="mchip ${S.mapFilter===f?'on':''}" data-mf="${f}">${f==='all'?'All':`<i style="background:${CAT[f].color}"></i>${CAT[f].label}`}</button>`).join('')}</div>
    ${PLACES.map((p,i)=>`<button class="pin ${S.place===i?'sel':''} ${S.mapFilter!=='all'&&S.mapFilter!==p.cat?'hide':''}" style="left:${p.x*100}%;top:${p.y*100}%" data-place="${i}" aria-label="${esc(p.name)}">${ci(p.cat, i===S.place?'fill':'line')}</button>`).join('')}
    <div class="me" style="left:${ME.x*100}%;top:${ME.y*100}%"><span><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6z"/></svg></span></div>
    <div class="pcard ${S.place!=null?'on':''}" id="pcard">${S.place!=null?placeCard(PLACES[S.place]):''}</div>
  </div>`;
  drawRoute();
}
function placeCard(p){ return `<div class="t"><b>${esc(p.name)}</b><small>${esc(p.info)}</small><small>${p.km} Kms away</small></div><button class="mini" data-call aria-label="Call">${IC.phone}</button><button class="mini" data-nav aria-label="Directions">${IC.nav}</button>`; }
function drawRoute(){
  const r=$('#route'), m=$('#map'); if(!r||!m) return;
  if(S.place==null){ r.innerHTML=''; return; }
  const W=m.clientWidth,H=m.clientHeight,p=PLACES[S.place];
  const x1=ME.x*W,y1=ME.y*H,x2=p.x*W,y2=p.y*H, mx=(x1+x2)/2+(y2-y1)*.2, my=(y1+y2)/2-(x2-x1)*.2;
  r.setAttribute('viewBox',`0 0 ${W} ${H}`);
  r.innerHTML=`<path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" stroke="#000" stroke-width="2.2" fill="none" stroke-dasharray="600" stroke-dashoffset="600"><animate attributeName="stroke-dashoffset" to="0" dur=".6s" fill="freeze"/></path>`;
}

/* ---------------- add form ---------------- */
function openPick(){ $('#pick').querySelectorAll('.big').forEach(b=>{ const c=b.dataset.new; b.innerHTML=IC[c]('#fff').replace('width="15"','width="20"').replace('width="16"','width="20"')+CAT[c].label; }); $('#pick').classList.add('on'); }
function closePick(){ $('#pick').classList.remove('on'); }
function openForm(cat){
  closePick();
  const d = S.m===TODAY.m ? TODAY.d : new Date(2017,S.m+1,0).getDate();
  S.draft={cat, title:'', place:'', amt:'', d};
  const f=$('#form');
  f.innerHTML = `<div class="ftop"><button type="button" class="circ o" data-cancel aria-label="Cancel">${IC.x}</button>
      <span class="circ big2 ${cat}">${IC[cat]('#fff').replace(/width="1[56]"/,'width="22"')}${CAT[cat].label}</span>
      <button class="circ d" id="saveBtn" aria-label="Save expense" disabled>${IC.check}</button></div>
    <div class="fields">
      <div class="f"><label for="fd">Description</label><input id="fd" name="t" placeholder="${CAT[cat].sugs[0]}" maxlength="40"></div>
      <div class="sugs">${CAT[cat].sugs.map(s=>`<button type="button" data-sug="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <div class="f"><label for="fp">Where</label><input id="fp" name="p" placeholder="Optional, e.g. BP Brooklyn" maxlength="40"></div>
      <div class="two"><div class="f"><label for="fa">Amount (₹)</label><input id="fa" name="a" inputmode="numeric" placeholder="Amount"></div>
        <div class="f"><label for="fdt">Date</label><select id="fdt" name="d">${Array.from({length:new Date(2017,S.m+1,0).getDate()},(_,i)=>i+1).filter(x=>S.m!==TODAY.m||x<=TODAY.d).map(x=>`<option value="${x}" ${x===d?'selected':''}>${x} ${MONTHS[S.m].slice(0,3)}</option>`).join('')}</select></div></div>
      <button type="button" class="photo" data-photo><span class="ph" id="ph">${IC.cam}</span><span id="phT">Add photo of the bill</span></button>
    </div>
    <p class="fnote">Saved to ${esc(car().name)} · ${MONTHS[S.m]}. This is a demo, nothing leaves your browser.</p>`;
  f.classList.add('on');
  setTimeout(()=>$('#fd').focus(),320);
}
function closeForm(){ $('#form').classList.remove('on'); }
function validate(){ const f=$('#form'); const ok=+f.a.value>0; $('#saveBtn').disabled=!ok; }

/* ---------------- overlays ---------------- */
function scrim(on){ $('#scrim').classList.toggle('on',on); }
function closeAll(){ $('#sheet').classList.remove('on'); $('#drawer').classList.remove('on'); scrim(false); }
function sheet(h){ const s=$('#sheet'); s.innerHTML='<div class="grab"></div>'+h; s.classList.add('on'); scrim(true); }
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2400); }
function drawer(){
  $('#drawer').innerHTML=`<div class="prof"><img src="img/me.webp" alt=""><b>Abhishek</b><span>Bangalore, India</span></div>
    <nav>${Object.entries(CARS).map(([k,c])=>`<button data-car="${k}" class="${S.car===k?'on':''}">${IC.car()}${esc(c.name)}</button>`).join('')}
    <button data-demo="Adding a new car">${IC.plus}Add a car</button><hr>
    <button data-demo="App settings">${IC.gear}App Settings</button><button data-demo="Feedback">${IC.chat}Feedback</button><button data-demo="Help">${IC.help}Help</button><hr>
    <button data-demo="Logout">${IC.power}Logout</button></nav>
    <p class="fine">Caralta, designed at Clarice Technologies. Rebuilt as an interactive portfolio prototype with sample data.</p>`;
}
function reminders(){
  const c=car();
  sheet(`<h3>Reminders for ${esc(c.name)}</h3>
    <div class="rem">${ci('service')}<div><b>Service due</b><span>Next general service at ${(Math.ceil(c.km/5000)*5000).toLocaleString('en-IN')} Kms, about ${Math.ceil(c.km/5000)*5000-c.km} Kms away</span></div><span class="when" style="color:var(--svc)">Soon</span></div>
    <div class="rem">${ci('repair')}<div><b>Insurance renewal</b><span>Policy ends on 2 Jan. Compare quotes before it lapses.</span></div><span class="when" style="color:var(--rep)">25 days</span></div>
    <div class="rem">${ci('gas')}<div><b>Fuel spend is up</b><span>You spent ${inr(sumBy(monthExp(),'gas'))} on gas in ${MONTHS[S.m]}. Reliance, 1.2 Kms away, is the cheapest near you.</span></div><span class="when" style="color:var(--gas)">Tip</span></div>`);
  if(!S.seen){ S.seen=true; const b=$('#bellN'); if(b) b.remove(); }
}
function detail(id){
  const e=EXP.find(x=>x.id==id);
  sheet(`<div class="det">${ci(e.cat,'fill')}<div><div style="font-size:13px;color:var(--mute)">${CAT[e.cat].label}</div><b>${inr(e.amt)}</b></div></div>
    <div class="kv"><div><span>Description</span>${esc(e.title)}</div>${e.place?`<div><span>Where</span>${esc(e.place)}</div>`:''}<div><span>Date</span>${e.d} ${MONTHS[e.m]} 2017</div><div><span>Car</span>${esc(CARS[e.car].name)}</div></div>
    <div class="acts2"><button class="del" data-del="${e.id}">Delete</button><button class="ok" data-closesheet>Done</button></div>`);
}

/* ---------------- render + paging ---------------- */
function renderAll(){ $('#carName').textContent=car().name; overview(); expenses(); mapPage(); drawer(); }
const pager=$('#pager');
function goPage(i,smooth=true){ pager.scrollTo({left:i*pager.clientWidth,behavior:smooth?'smooth':'auto'}); }
pager.addEventListener('scroll',()=>{ const i=Math.round(pager.scrollLeft/pager.clientWidth); if(i!==S.page){ S.page=i; document.querySelectorAll('#dots button').forEach((b,j)=>b.classList.toggle('on',j===i)); } },{passive:true});
addEventListener('resize',()=>{ goPage(S.page,false); drawRoute(); });

document.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(e.target.id==='scrim'){ closeAll(); return; }
  if(!t) return; const ds=t.dataset;
  if('menu' in ds){ $('#drawer').classList.add('on'); scrim(true); return; }
  if('bell' in ds){ reminders(); return; }
  if(ds.page!==undefined){ goPage(+ds.page); return; }
  if(ds.mon){ const m=S.m+ +ds.mon; if(m<minMonth()||m>maxMonth()) return; S.m=m; S.lastNew=null; overview(); expenses(); return; }
  if(ds.cat){ S.filter=ds.cat; expenses(); goPage(1); return; }
  if(ds.filter){ S.filter=ds.filter; expenses(); return; }
  if('add' in ds){ openPick(); return; }
  if('closepick' in ds){ closePick(); return; }
  if(ds.new){ openForm(ds.new); return; }
  if('cancel' in ds){ closeForm(); return; }
  if(ds.sug){ const f=$('#form'); f.t.value=ds.sug; f.a.focus(); return; }
  if('photo' in ds){ const p=$('#ph'); p.classList.add('ok'); p.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#33c376" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>'; $('#phT').textContent='Bill photo added (demo)'; return; }
  if(ds.exp){ detail(ds.exp); return; }
  if(ds.del){ const i=EXP.findIndex(x=>x.id==ds.del); const x=EXP.splice(i,1)[0]; closeAll(); overview(); expenses(); toast(`Deleted ${x.title} (${inr(x.amt)})`); return; }
  if('closesheet' in ds){ closeAll(); return; }
  if(ds.car){ S.car=ds.car; S.m=10; S.filter='all'; S.lastNew=null; closeAll(); renderAll(); toast(`Showing ${car().name}`); return; }
  if(ds.demo){ closeAll(); toast(`${ds.demo} isn’t part of this prototype`); return; }
  if(ds.mf){ S.mapFilter=ds.mf; if(S.place!=null && ds.mf!=='all' && PLACES[S.place].cat!==ds.mf) S.place=null; mapPage(); return; }
  if(ds.place!==undefined){ const i=+ds.place; S.place = S.place===i?null:i; mapPage(); return; }
  if('call' in ds){ toast(`Calling ${PLACES[S.place].name} (demo)`); return; }
  if('nav' in ds){ toast(`Directions to ${PLACES[S.place].name} · ${PLACES[S.place].km} Kms (demo)`); return; }
});
document.addEventListener('input',e=>{ if(e.target.form&&e.target.form.id==='form'){ if(e.target.name==='a') e.target.value=e.target.value.replace(/\D/g,'').slice(0,6); validate(); } });
$('#form').addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target; const amt=+f.a.value; if(!amt) return;
  const n={id:++uid,car:S.car,cat:S.draft.cat,title:f.t.value.trim()||CAT[S.draft.cat].sugs[0],place:f.p.value.trim(),m:S.m,d:+f.d.value,amt};
  EXP.push(n); S.lastNew=n.id; S.filter='all'; closeForm(); overview(); expenses(); goPage(1);
  toast(`Added ${n.title} · ${inr(amt)}`);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeAll(); closePick(); closeForm(); } });
$('#scrim').addEventListener('click',closeAll);

renderAll();
</script>
</body>
</html>
