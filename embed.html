<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caralta · Interactive Prototype</title>
<meta name="description" content="Caralta, a car expense tracker designed at Clarice Technologies, as an interactive prototype in a phone frame. Portfolio project by Abhishek Bora.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f1f2f4;min-height:100%}
body{font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:#414146;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px}
.wrap{display:flex;flex-direction:column;align-items:center;gap:18px;transform-origin:top center}
/* dark phone on a light grey background */
.phone{width:386px;flex:none;padding:12px;border-radius:56px;background:#1e1e28;box-shadow:0 30px 60px -24px rgba(0,0,0,.35);position:relative}
.phone::before,.phone::after{content:"";position:absolute;width:3px;border-radius:2px;background:#131319}
.phone::before{left:-3px;top:140px;height:60px}
.phone::after{right:-3px;top:180px;height:84px}
.screen{position:relative;height:790px;border-radius:44px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 34px;font-size:14px;font-weight:700;color:#1e1e28;position:relative;background:#fff}
.notch{position:absolute;left:50%;top:0;transform:translateX(-50%);width:150px;height:28px;border-radius:0 0 18px 18px;background:#1e1e28}
.icons{display:flex;gap:5px;align-items:center}
iframe{flex:1;width:100%;border:0;display:block;background:#fff}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;background:rgba(0,0,0,.25);pointer-events:none}
.cap{text-align:center}
.cap b{display:block;font-size:15px;font-weight:700;color:#1e1e28}
.cap span{display:block;font-size:13px;color:#787887;margin-top:3px}
.note{font-size:12px;color:#9a9aa6;margin-top:16px;text-align:center}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap" id="wrap">
    <div class="phone">
      <div class="screen">
        <div class="status"><span>9:41</span><span class="notch"></span>
          <span class="icons">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="#1e1e28"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
            <svg width="15" height="11" viewBox="0 0 15 11" fill="#1e1e28"><path d="M7.5 2.2c2.1 0 4 .8 5.4 2.1l1.1-1.1A9.2 9.2 0 0 0 7.5.6 9.2 9.2 0 0 0 1 3.2l1.1 1.1a7.6 7.6 0 0 1 5.4-2.1Zm0 3.1c1.2 0 2.3.5 3.2 1.2l1.1-1.1a6.2 6.2 0 0 0-8.6 0l1.1 1.1c.9-.8 2-1.2 3.2-1.2Zm0 3.1c-.4 0-.8.2-1.1.5l1.1 1.1 1.1-1.1c-.3-.3-.7-.5-1.1-.5Z"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3" stroke="#1e1e28" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2" fill="#1e1e28"/><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2S23.8 4.3 23 4Z" fill="#1e1e28" opacity=".4"/></svg>
          </span></div>
        <iframe src="./?embed=1" title="Caralta interactive prototype"></iframe>
        <div class="home"></div>
      </div>
    </div>
    <div class="cap"><b>Caralta · car expense app</b><span>Swipe between overview, expenses and nearby, or add an expense</span></div>
  </div>
  <p class="note">Interactive prototype · designed at Clarice Technologies · sample data</p>
</main>
<script>
function fit(){
  const w = document.getElementById('wrap');
  w.style.transform=''; w.style.marginBottom='';
  const H = w.offsetHeight, W = w.offsetWidth;
  const kh = innerHeight > 360 ? (innerHeight - 90)/H : 1;
  const k = Math.max(.4, Math.min(1, (innerWidth - 32)/W, kh));
  w.style.transform = k<1 ? `scale(${k})` : '';
  w.style.marginBottom = k<1 ? `${-(H*(1-k))}px` : '';
}
addEventListener('resize', fit); addEventListener('load', fit); fit(); setTimeout(fit, 600);
</script>
</body>
</html>
